services:
  postgres-staging:
    image: postgres:16-alpine
    container_name: safaryaty-postgres-staging
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-safaryaty}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-safaryaty_staging_only}
      POSTGRES_DB: ${POSTGRES_DB:-safaryaty_staging}
    ports:
      - "${POSTGRES_PORT:-55432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-safaryaty} -d ${POSTGRES_DB:-safaryaty_staging}"]
      interval: 5s
      timeout: 5s
      retries: 12
    volumes:
      - safaryaty_postgres_staging_data:/var/lib/postgresql/data

volumes:
  safaryaty_postgres_staging_data:
